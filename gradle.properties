# --- Build machine ---------------------------------------------------------------
# Capped so the build fits on small machines (and on the owner's production VM).
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx768m
# Compile Kotlin inside the Gradle process: one JVM less.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- App defaults (become BuildConfig fields; all user-editable in Ajustes) -----
nmt.versionName=1.5.0
# Empty = derived from versionName (major*10000 + minor*100 + patch).
nmt.versionCode=
# Base URL of the NoniMail Tools service (licenses, telemetry).
nmt.serviceUrl=https://mt.nonosky.com
# GitHub repository shown in "About".
nmt.repoUrl=https://github.com/nonoskygt/nonimail-tools-android
# Local AI (Ollama on the user's LAN). Empty URL = heuristics only.
nmt.ollamaPort=11434
nmt.ollamaModel=qwen3.5:9b
nmt.ollamaTimeoutMs=120000
# IMAP and HTTP timeouts.
nmt.imapConnectTimeoutMs=30000
nmt.imapTimeoutMs=120000
nmt.httpTimeoutMs=15000
# License prices, display only (the service sells them).
nmt.priceCurrency=USD
nmt.priceLimpiar=1
nmt.priceSincronizar=2
nmt.licenseDays=30
# Self-update from GitHub Releases (the APK is distributed there, not through Play).
# Repository owner/name; the app asks <apiBase>/repos/<repo>/releases/latest.
nmt.updateRepo=nonoskygt/nonimail-tools-android
nmt.updateApiBase=https://api.github.com
nmt.updateApkAsset=NoniMail-Tools.apk
nmt.updateSumsAsset=SHA256SUMS.txt
# Check at app start at most every N hours, and in the background every M hours (needs network).
nmt.updateMinHours=0
nmt.updatePeriodHours=12
# Telemetry: where this build was downloaded from. CI release builds pass github.
nmt.origenDescarga=desconocido

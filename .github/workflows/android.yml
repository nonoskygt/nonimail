name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoniMail-Tools-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NMT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB (download origin = github)
        env:
          NMT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NMT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NMT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -Pnmt.origenDescarga=github \
            -Pnmt.versionName="$VERSION"

      - name: Collect files and checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NoniMail-Tools-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/NoniMail-Tools.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/NoniMail-Tools-$VERSION.aab"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs dist/NoniMail-Tools.apk | grep -v '^WARNING'
          (cd dist && sha256sum NoniMail-Tools-"$VERSION".apk NoniMail-Tools.apk NoniMail-Tools-"$VERSION".aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NoniMail-Tools.apk
            dist/NoniMail-Tools-*.apk
            dist/NoniMail-Tools-*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true

name: Escritorio (pruebas)

on:
  push:
    branches: [main, 'agente/**', 'claude/**']
    paths: ['escritorio/**', '.github/workflows/escritorio-*.yml']
  pull_request:
    paths: ['escritorio/**', '.github/workflows/escritorio-*.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: escritorio

jobs:
  test:
    name: Pruebas (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: escritorio/package-lock.json
      # Las pruebas no necesitan Electron: se omite su descarga
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
